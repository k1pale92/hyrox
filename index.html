<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1132">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="하이록스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>하이록스 인천 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app — drifting colour field + diagonal speed lines behind a glass header, race-track hero, kind-coloured session bands, fixed glass tab bar */
:root{
  --bg:#eceef7; --surface:rgba(255,255,255,.84); --surface-solid:#ffffff; --ink:#10132a; --muted:#585e7a; --line:#d6daeb; --chip:#e6e9f6;
  --accent:#3654ff; --accent-2:#7a3cff; --accent-ink:#ffffff; --accent-soft:#e1e6ff;
  --hot:#ff5a1f; --hot-soft:#ffe5d9;
  --ok:#12854a; --ok-soft:#d6f1e1; --warn:#985700; --warn-soft:#fbebcf; --bad:#c42b2b;
  --k-str:#7a3cff; --k-hx:#00998b; --k-run:#3654ff; --k-rest:#878da6; --k-evt:#ff5a1f;
  --hero-a:#0c1132; --hero-b:#2d1672; --hero-ink:#f3f4ff; --hero-muted:#aab0da; --hero-line:rgba(255,255,255,.14);
  --stripe:rgba(54,84,255,.07); --glass:rgba(236,238,247,.72);
  --c-run:#3654ff; --c-st:#00998b; --c-rox:#ff5a1f;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080a16; --surface:rgba(21,24,44,.82); --surface-solid:#151829; --ink:#eceefe; --muted:#9ba1c6; --line:#272c4c; --chip:#1f2440;
    --accent:#8c9cff; --accent-2:#b48cff; --accent-ink:#0a0e2a; --accent-soft:#1b2252;
    --hot:#ff8a55; --hot-soft:#3a1c10;
    --ok:#5fd394; --ok-soft:#123021; --warn:#f2b45c; --warn-soft:#372710; --bad:#ff7a7a;
    --k-str:#b48cff; --k-hx:#3fd6c5; --k-run:#8c9cff; --k-rest:#7f86a3; --k-evt:#ff8a55;
    --hero-a:#10164a; --hero-b:#3b1c8f; --stripe:rgba(140,156,255,.06); --glass:rgba(8,10,22,.7);
    --c-run:#6f83ff; --c-st:#1aa898; --c-rox:#e8692f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080a16; --surface:rgba(21,24,44,.82); --surface-solid:#151829; --ink:#eceefe; --muted:#9ba1c6; --line:#272c4c; --chip:#1f2440;
  --accent:#8c9cff; --accent-2:#b48cff; --accent-ink:#0a0e2a; --accent-soft:#1b2252;
  --hot:#ff8a55; --hot-soft:#3a1c10;
  --ok:#5fd394; --ok-soft:#123021; --warn:#f2b45c; --warn-soft:#372710; --bad:#ff7a7a;
  --k-str:#b48cff; --k-hx:#3fd6c5; --k-run:#8c9cff; --k-rest:#7f86a3; --k-evt:#ff8a55;
  --hero-a:#10164a; --hero-b:#3b1c8f; --stripe:rgba(140,156,255,.06); --glass:rgba(8,10,22,.7);
  --c-run:#6f83ff; --c-st:#1aa898; --c-rox:#e8692f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;word-break:keep-all;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* moving background */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.bgfx i:nth-child(1){width:70vmax;height:50vmax;left:40%;top:-25vmax;background:color-mix(in srgb,var(--accent-2) 45%,transparent)}
.bgfx i:nth-child(2){width:60vmax;height:45vmax;left:-30vmax;top:30%;background:color-mix(in srgb,var(--accent) 40%,transparent)}
.bgfx i:nth-child(3){width:50vmax;height:35vmax;right:-20vmax;bottom:-15vmax;background:color-mix(in srgb,var(--hot) 30%,transparent)}
.bgfx b{position:absolute;inset:-20%;background:repeating-linear-gradient(-28deg,var(--stripe) 0 2px,transparent 2px 26px)}
.bgfx s{position:absolute;height:2px;width:38vw;left:-40vw;border-radius:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 55%,transparent));transform:rotate(-28deg);text-decoration:none}
.bgfx s:nth-of-type(1){top:22%} .bgfx s:nth-of-type(2){top:58%} .bgfx s:nth-of-type(3){top:84%}
@media (prefers-reduced-motion: no-preference){
  .bgfx i:nth-child(1){animation:drift1 22s ease-in-out infinite alternate}
  .bgfx i:nth-child(2){animation:drift2 26s ease-in-out infinite alternate}
  .bgfx i:nth-child(3){animation:drift1 30s ease-in-out infinite alternate-reverse}
  .bgfx b{animation:slide 18s linear infinite}
  .bgfx s{animation:zip 7s linear infinite}
  .bgfx s:nth-of-type(2){animation-delay:2.4s;animation-duration:9s}
  .bgfx s:nth-of-type(3){animation-delay:4.8s;animation-duration:8s}
}
@keyframes drift1{to{transform:translate(-12vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(14vmax,-8vmax) scale(.9)}}
@keyframes slide{to{transform:translate(52px,0)}}
@keyframes zip{0%{transform:translate(0,0) rotate(-28deg);opacity:0}10%{opacity:1}60%{opacity:1}100%{transform:translate(190vw,-100vw) rotate(-28deg);opacity:0}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.mark{font-family:var(--f-display);font-size:17px;letter-spacing:.5px;background:linear-gradient(100deg,var(--accent),var(--accent-2) 60%,var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.top-sub{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.save.on{background:var(--ok-soft);color:var(--ok)}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
.panel{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h2{font-size:16px;margin:0 0 10px;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
ul.lines{margin:4px 0 0;padding-left:18px}
ul.lines li{margin:4px 0}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:var(--hero-ink);background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 70%,color-mix(in srgb,var(--hero-b) 70%,var(--hot)) 100%);box-shadow:0 18px 40px -22px color-mix(in srgb,var(--accent-2) 70%,transparent)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-28deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px);pointer-events:none}
.hero::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--hot) 60%,transparent),transparent 70%);opacity:.55;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{display:flex;align-items:flex-end;gap:12px}
.hero .dd{font-family:var(--f-display);font-size:54px;line-height:.9;letter-spacing:1px;background:linear-gradient(180deg,#fff,#c9ceff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lbl{font-size:12px;color:var(--hero-muted);letter-spacing:.06em}
.hero .goal{margin-left:auto;text-align:right}
.hero .goal b{display:block;font-family:var(--f-mono);font-size:20px;color:#fff}
.track{display:block;width:100%;height:auto;margin:10px 0 2px}
.track text{font-family:var(--f-display)}
.phasebar{display:flex;gap:3px;margin-top:6px}
.phasebar span{height:6px;border-radius:3px;background:var(--hero-line)}
.phasebar span.on{background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--hot) 60%,#fff))}
.phasebar span.done{background:rgba(255,255,255,.5)}
.phaselbl{display:flex;justify-content:space-between;font-size:11px;color:var(--hero-muted);margin-top:4px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hstat{background:rgba(255,255,255,.08);border:1px solid var(--hero-line);border-radius:12px;padding:8px 10px}
.hstat .l{font-size:11px;color:var(--hero-muted)}
.hstat .v{font-family:var(--f-mono);font-size:18px;font-weight:700;color:#fff}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dbtn{border:1px solid var(--line);background:var(--surface-solid);border-radius:14px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
.dbtn .w{font-size:11px;color:var(--muted)}
.dbtn .d{font-size:15px;font-weight:600}
.dbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--k)}
.dbtn.today .w{color:var(--accent);font-weight:700}
.dbtn.sel{border-color:transparent;background:linear-gradient(150deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:0 8px 18px -10px var(--accent)}
.dbtn.sel .w{color:var(--accent-ink);opacity:.85}
.dbtn.sel .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.dbtn.done .dot{background:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.k-strength{--k:var(--k-str)} .k-run,.k-easy,.k-long{--k:var(--k-run)} .k-hyrox{--k:var(--k-hx)} .k-rest{--k:var(--k-rest)} .k-test,.k-sim,.k-race{--k:var(--k-evt)}

/* session */
.sess{padding:0;overflow:hidden}
.band{position:relative;padding:14px 16px 16px;color:#fff;background:linear-gradient(120deg,var(--k),color-mix(in srgb,var(--k) 45%,var(--accent-2)))}
.band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-28deg,rgba(255,255,255,.12) 0 3px,transparent 3px 14px);mask-image:linear-gradient(90deg,transparent 35%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000)}
.band>*{position:relative}
.band .kchip{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.22);white-space:nowrap}
.band .date{font-size:12px;opacity:.85;margin-left:6px}
.band .title{font-family:var(--f-display);font-size:24px;line-height:1.2;margin-top:8px;letter-spacing:.3px;text-wrap:balance}
.sess-body{padding:14px 16px 16px}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fact{background:var(--chip);border-radius:9px;padding:4px 10px;font-size:13px}
.fact b{font-family:var(--f-mono);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface-solid);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn.pri{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 22px -14px var(--accent)}
.btn.okb{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.hotb{background:linear-gradient(120deg,var(--hot),color-mix(in srgb,var(--hot) 60%,var(--accent-2)));border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.dbtn:focus-visible,.tab:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.wk-h:focus-visible,.wd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.big{width:100%;padding:13px;font-size:15px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface-solid);border-radius:11px;padding:9px 10px;width:100%;min-width:0;font-size:15px}
textarea{resize:vertical;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--warn-soft)}
.note.ok{background:var(--ok-soft)} .note.info{background:var(--accent-soft)}
.navd{display:flex;align-items:center;gap:8px}
.navd .lbl{flex:1;text-align:center;font-weight:600}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface-solid)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--chip);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.nw{white-space:nowrap}
tr.tot td{font-weight:700;background:var(--chip)}
.st{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.no{background:var(--warn-soft);color:var(--warn)} .st.na{background:var(--chip);color:var(--muted)}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.tick{height:2px;width:12px;vertical-align:3px;background:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--surface-solid);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;box-shadow:0 8px 20px -10px rgba(0,0,0,.35);white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.tip b{font-family:var(--f-mono)}

/* plan list */
.wk{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.wk-h{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.wk-n{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.wk.cur{border-color:transparent;box-shadow:0 0 0 2px var(--accent)}
.wk.cur .wk-n{color:var(--accent)}
.wk.past{opacity:.75}
.wk-t{min-width:0}
.wk-t b{font-size:14px}
.wk-t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-r{text-align:right;font-size:12px;color:var(--muted)}
.wk-r b{display:block;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.bar{height:4px;background:var(--chip);border-radius:2px;margin-top:4px;overflow:hidden;width:64px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--ok)}
.wk-days{border-top:1px solid var(--line);padding:4px 0}
.wd{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;padding:7px 12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-size:13.5px}
.wd:hover{background:var(--chip)}
.wd .dd{color:var(--muted);font-size:12px}
.wd .tt{display:flex;align-items:center;gap:7px;min-width:0}
.wd .tt i{width:8px;height:8px;border-radius:50%;background:var(--k);flex:none}
.wd .tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{color:var(--ok);font-weight:700}
.phase-h{font-family:var(--f-display);font-size:15px;color:var(--ink);margin:10px 2px 0;display:flex;align-items:center;gap:8px}
.phase-h::after{content:"";flex:1;height:2px;border-radius:1px;background:linear-gradient(90deg,var(--accent),transparent)}

/* diet */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface-solid);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chipbtn.on{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.tile{background:var(--chip);border-radius:12px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-mono);font-size:19px;font-weight:600}

/* timer */
.clock{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:var(--hero-ink);background:linear-gradient(140deg,var(--hero-a),var(--hero-b))}
.clock::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-28deg,rgba(255,255,255,.05) 0 2px,transparent 2px 18px)}
.clock>*{position:relative}
.clock .seg{font-family:var(--f-display);font-size:26px;line-height:1.15;margin-top:4px}
.clock .segt{font-family:var(--f-mono);font-size:46px;font-weight:700;line-height:1.05;margin-top:6px;letter-spacing:-1px}
.clock .tot{font-family:var(--f-mono);font-size:15px;color:var(--hero-muted)}
.clock .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.clock .meta div{background:rgba(255,255,255,.08);border:1px solid var(--hero-line);border-radius:12px;padding:7px 9px}
.clock .meta span{display:block;font-size:11px;color:var(--hero-muted)}
.clock .meta b{font-family:var(--f-mono);font-size:16px;color:#fff}
.dlt.good{color:#7cf0ad} .dlt.bad{color:#ffb19a}
.segbar{display:flex;gap:2px;margin-top:12px}
.segbar span{flex:1;height:7px;border-radius:2px;background:var(--hero-line)}
.segbar span.r{flex:1}
.segbar span.done{background:rgba(255,255,255,.75)}
.segbar span.now{background:var(--hot)}
.segbar span.st{height:7px}
.gobtn{width:100%;padding:20px;font-size:20px;font-family:var(--f-display);letter-spacing:.5px;border-radius:18px;margin-top:12px}
.dl{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.dl.good{color:var(--ok)} .dl.bad{color:var(--bad)}
tr.cur td{background:var(--accent-soft)}

/* home */
.goalbox{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:10px 12px}
.goalbox .l{font-size:11px;color:var(--muted);letter-spacing:.06em;grid-column:1}
.goalbox .v{font-weight:700;font-size:15px;grid-column:1}
.goalbox .t{grid-column:1;font-size:13px}
.goalbox .t b{font-size:17px;color:var(--accent)}
.goalbox .btn{grid-column:2;grid-row:1/4}
.gapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gapc{background:var(--chip);border-radius:12px;padding:8px 9px;min-width:0}
.gapc .l{font-size:12px;color:var(--muted)}
.gapc .v{font-family:var(--f-mono);font-weight:700;font-size:15px}
.gapc .v.good{color:var(--ok)} .gapc .v.bad{color:var(--bad)}
.gapc .s{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tl{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl-i{position:relative}
.tl-i::before{content:"";position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface-solid);border:2px solid var(--line)}
.tl-i.cur::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tl-i.cur .tl-h b{color:var(--accent)}
.tl-r{font-size:13px;margin-top:3px;display:flex;gap:6px;align-items:baseline}
.tg{flex:none;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;color:#fff}
.tg.r{background:var(--c-run)} .tg.s{background:var(--c-st)}
@media (max-width:380px){ .gapgrid{grid-template-columns:1fr} }

h3.step{font-size:14px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
h3.step:first-of-type{margin-top:4px}
h3.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--f-mono);background:linear-gradient(120deg,var(--accent),var(--accent-2));color:var(--accent-ink)}
.segcfg{display:grid;grid-template-columns:auto 1fr 118px;gap:6px 8px;align-items:center;font-size:13.5px}
.segcfg input[type=text]{padding:6px 8px;font-size:14px}
.segcfg .run{color:var(--muted)}

/* sub nav */
.subnav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.subnav button{border:0;background:transparent;border-radius:10px;padding:8px 0;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.subnav button.on{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:var(--accent-ink)}

/* station effect bars */
.sbars{display:flex;flex-direction:column;gap:7px}
.sbar{display:grid;grid-template-columns:92px 1fr 54px;gap:8px;align-items:center;font-size:13px}
.sbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .tr{position:relative;height:12px;background:var(--chip);border-radius:6px;overflow:visible}
.sbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.sbar .tr b{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.sbar .v{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.sbar.low .nm{color:var(--hot);font-weight:700}
.mchips{display:flex;flex-wrap:wrap;gap:5px}
.mchip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.mchip.off{background:var(--chip);color:var(--muted);text-decoration:line-through}
.wod{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.wod-h{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 12px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
.wod-d{font-family:var(--f-mono);font-size:12px;color:var(--muted);line-height:1.25}
.wod-d b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);font-weight:400}
.wod-t{min-width:0}
.wod-t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wod-t span{font-size:12px;color:var(--muted)}
.wod-s{text-align:right;font-family:var(--f-mono);font-weight:700;font-size:15px}
.wod-body{border-top:1px solid var(--line);padding:12px}
.prog{white-space:pre-wrap;font-size:13px;background:var(--chip);border-radius:10px;padding:10px 12px;margin:0}
.lib-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.lib-pick button{flex:none;border:1px solid var(--line);background:var(--surface-solid);border-radius:12px;padding:7px 10px;text-align:left;cursor:pointer;max-width:180px}
.lib-pick button b{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lib-pick button span{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-pick button.on{border-color:transparent;box-shadow:0 0 0 2px var(--accent)}
.lib-pick button.did b::after{content:" ✓";color:var(--ok)}

.rowed{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface-solid)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.grid4 input{padding:7px 6px;font-size:14px}
@media (max-width:380px){ .grid4{grid-template-columns:repeat(2,1fr)} }

/* analysis */
.sel{display:flex;flex-direction:column;gap:8px}
.sel .row{gap:6px}
.sel .lab{font-size:12px;color:var(--muted);width:42px;flex:none}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi{background:var(--chip);border-radius:12px;padding:8px 9px;min-width:0}
.kpi .l{font-size:11px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:15px;font-weight:700}
.comp{display:flex;flex-direction:column;gap:8px}
.crow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center}
.crow .p{font-size:12px;line-height:1.2}
.crow .p b{display:block;font-family:var(--f-mono);font-size:13px}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-solid)}
.stack span{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.stack .r{background:var(--c-run)} .stack .s{background:var(--c-st)} .stack .x{background:var(--c-rox)}
.crow.me .p{color:var(--accent);font-weight:700}
.crow.me .stack{box-shadow:0 0 0 2px var(--accent)}
.legend i.r{background:var(--c-run)} .legend i.s{background:var(--c-st)} .legend i.x{background:var(--c-rox)}

function parseT(s){ s=String(s||'').trim(); if(!s) return null;
  if(/^\d{3,6}$/.test(s)){ var d6=s.padStart(6,'0'), hh=+d6.slice(0,2), mm=+d6.slice(2,4), ss=+d6.slice(4); if(mm>59||ss>59) return null; var tt=hh*3600+mm*60+ss; return tt>0?tt:null; }
  var p=s.split(':'); var t=0; for(var i=0;i<p.length;i++){ var x=Number(p[i]); if(!isFinite(x)||x<0) return null; t=t*60+x; } return t>0?Math.round(t):null; }
function fmtT(t){ if(t==null) return '—'; t=Math.round(t); var h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); }

function dietType(n){

function initDb(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0], user=r[1];
    if(!db||!user) return null;
    return user.id().then(function(uid){
      if(!uid) return;
      col=db.collection('data/users/'+uid);
      var first=true;
      col.onSnapshot(function(snap){
        if(first){
          first=false;
          var hasLocal=Object.keys(store.days).length||store.tests.length||store.body.length||store.wods.length||store.workouts.length;
          store.mode='db'; setSaveBadge();
          if(snap.empty && hasLocal){
            Object.keys(store.days).forEach(saveDay); if(store.tests.length) saveTests(); if(store.body.length) saveBody(); if(store.wods.length) saveWods(); if(store.workouts.length) saveWorkouts(); saveGoal();
            return;
          }
        }
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        var days={}, tests=[], body=[], wods=[], workouts=[], goal=null;
        snap.docs.forEach(function(doc){
          var v=doc.data()||{};
          if(doc.id.indexOf('day-')===0) days[doc.id.slice(4)]=v;
          else if(doc.id==='tests') tests=Array.isArray(v.entries)?v.entries:[];
          else if(doc.id==='body') body=Array.isArray(v.entries)?v.entries:[];
          else if(doc.id==='wods') wods=Array.isArray(v.entries)?v.entries:[];
          else if(doc.id==='profile'&&v.goal) goal=v.goal;
          else if(doc.id==='workouts') workouts=Array.isArray(v.entries)?v.entries:[];
        });
        store.days=days; store.tests=tests; store.body=body; store.wods=wods; store.workouts=workouts; if(goal){ store.goal=Object.assign({},GOAL0,goal); syncAnaToGoal(); } saveLocal();
        softRender();
      },function(){ store.mode='local'; setSaveBadge(); toast('계정 저장이 끊겨서 이 기기에만 저장해요.'); });
    });
  }).catch(function(){});
}

function weekKinds(w){
  var ws=w<=0?PLAN_START:weekStart(w), we=w<=0?W1-1:ws+6, o={}, km=0, plannedKm=0;
  for(var m=ws;m<=we;m++){ var s=sessionFor(m), r=dayRec(key(m)), k=s.kind==='test'||s.kind==='sim'||s.kind==='race'?'evt':s.kind;

  return {ws:ws,we:we,o:o,km:Math.round(km*10)/10,pkm:KM[Math.max(0,w)]||plannedKm,wods:wods};
}

function sparkSvg(list,target){

  var s=target?'<line x1="'+X0+'" x2="'+X1+'" y1="'+y(target)+'" y2="'+y(target)+'" stroke="var(--ok)" stroke-dasharray="4 3"/><text x="'+X1+'" y="'+(y(target)-3)+'" text-anchor="end">목표 '+fmtT(target)+'</text>':'';

  return '<div class="chart" style="margin:6px 0 4px"><svg viewBox="0 0 340 66" role="img" aria-label="기록 추이 (아래로 갈수록 느림)">'+s+'</svg></div>';

}
function effectSummary(w){
  var e=wodEffect(w), arr=ST9.map(function(x){ return [x[0],e[x[0]]]; }).filter(function(a){ return a[1]>0; }).sort(function(a,b){ return b[1]-a[1]; });
  var tot=arr.reduce(function(a,b){ return a+b[1]; },0);
  if(!tot) return '<div class="muted">동작과 운동 시간을 넣으면 효과가 계산돼요.</div>';
  var top=arr.slice(0,3).map(function(a){ return ST9N[a[0]]+' '+Math.round(a[1]/tot*100)+'%'; }).join(' · ');
  return '<div class="note info" style="margin-bottom:10px">이번 WOD 자극의 대부분이 <b>'+top+'</b>로 가요. 총 '+tot.toFixed(1)+'점.</div>'+effBars(e)+volChips(w);
}
function stationGapWeight(k){
  if(k==='run'){ var z=est10k(); return Math.max(.8,Math.min(1.6,((z.s/10+35)*8)/2550)); }
  var b=best(k), m=testMeta(k);
  if(!b||!m||!m.t) return 1; return Math.max(.8,Math.min(1.6,b.s/m.t));
}

function applyRecognized(o){
  var w=ui.wd||blankWod(null); ui.wd=w;
  if(o.title) w.t=String(o.title);
  if(o.program_text) w.text=String(o.program_text);
  if(o.team!=null) w.team=!!o.team;
  if(Number(o.rounds)>0) w.rounds=Number(o.rounds);
  if(Number(o.duration_min)>0) w.dur=Number(o.duration_min);
  var rows=[];
  (o.movements||[]).forEach(function(m){
    var mv=MOVEMAP[m.move_key]?m.move_key:'custom';
    var r={mv:mv}; if(mv==='custom'){ r.name=String(m.name||''); if(ST9N[m.station]) r.st=m.station; }
    ['reps','distance_m','weight_kg','calories','my_time_sec'].forEach(function(f){ var x=Number(m[f]); if(x>0) r[{reps:'reps',distance_m:'dist',weight_kg:'kg',calories:'cal',my_time_sec:'sec'}[f]]=x; });
    rows.push(r);
  });
  if(!rows.length) rows=parseRows(w.text);
  w.rows=rows; w.moves=detectMoves(w.text); w.off=[];
  var R=o.result||{}, map={time:'time',reps:'reps',rounds:'rounds',distance:'dist',weight:'kg',none:'none'};
  if(map[R.type]){ w.fmt=map[R.type]; if(R.value!=null) w.score=String(R.value); }
  if(w.fmt==='time'&&parseT(w.score)&&!Number(w.dur)) w.dur=Math.round(parseT(w.score)/6)/10;
  w.mode=rows.length?'adv':'simple';
}

    'Extract the workout for a male athlete at the "Open" (or RX if no Open) level. Use the weight that applies to men.\n'+
    'Reply with only JSON of this shape:\n{"title": string, "program_text": string (the program as plain text, line by line), "team": boolean, "rounds": number|null, "duration_min": number|null (time cap or AMRAP length, or the result time in minutes if for time), "movements": [{"name": string, "move_key": string, "station": string|null, "reps": number|null, "distance_m": number|null, "weight_kg": number|null (convert lb to kg), "calories": number|null, "my_time_sec": number|null}], "result": {"type": "time"|"reps"|"rounds"|"distance"|"weight"|"none", "value": string|null}}\n'+
    'move_key must be one of these keys (use "custom" if none fit, and then set station to one of run, ski, push, pull, bbj, row, farm, lunge, wb that it trains most):\n'+keys+'\n'+
    'For "result.value" use mm:ss for time, "5+12" for rounds+reps, or a plain number. If there is no result photo, set result to {"type":"none","value":null}.';
  phCtl=new AbortController();

    if(!/^\d{4}-\d{2}-\d{2}$/.test(w.d)){ toast('날짜를 골라 주세요'); return; }
    if(!w.t.trim() && !w.text.trim()){ toast('제목이나 프로그램 내용을 넣어 주세요'); return; }
    if(w.fmt==='time' && w.score && !parseT(w.score)){ toast('시간은 18:42 형식으로 넣어 주세요'); return; }
    var dur=Number(w.dur); if(w.fmt==='time'&&parseT(w.score)&&!dur) dur=Math.round(parseT(w.score)/6)/10;
    if(!(dur>0)){ toast('운동 시간(분)을 넣어 주세요'); return; }
    var cleanRows=(w.rows||[]).filter(function(r){ return r.mv; }).map(function(r){ var o={mv:r.mv}; ['reps','dist','kg','cal','sec'].forEach(function(f){ var x=Number(r[f]); if(x>0) o[f]=x; }); if(r.mv==='custom'){ o.name=String(r.name||'').slice(0,60); if(r.st) o.st=r.st; } return o; });
    var rec={id:w.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6),lib:w.lib||null,d:w.d,t:w.t.trim(),text:w.text,mode:w.mode==='adv'?'adv':'simple',fmt:w.fmt,score:w.fmt==='none'?'':String(w.score||'').trim(),dur:dur,rpe:Math.min(10,Math.max(1,parseInt(w.rpe,10)||7)),team:!!w.team,level:w.level,note:w.note||'',moves:w.moves.slice(),off:w.off.slice(),rows:cleanRows,rounds:Number(w.rounds)||''};
    store.wods=store.wods.filter(function(x){ return x.id!==rec.id; }).concat([rec]); saveWods();
    var ef=wodEffect(rec), tp=ST9.map(function(s){ return [s[1],ef[s[0]]]; }).sort(function(x,y){ return y[1]-x[1]; })[0];
    ui.wd=null; ui.wodOpen=rec.id; toast('저장했어요'+(tp&&tp[1]?' · '+tp[0]+' 자극 '+tp[1].toFixed(1):'')); render(); return;
  }
  if(a==='install'){ if(installEvt){ installEvt.prompt(); installEvt.userChoice.then(function(){ installEvt=null; render(); }).catch(function(){}); } return; }
  if(a==='backup'){
    var json=JSON.stringify({app:'hyrox-incheon-2027',v:1,saved:new Date().toISOString(),days:store.days,tests:store.tests,body:store.body,wods:store.wods,workouts:store.workouts,goal:store.goal});
    if(IS_PWA){
      try{ var url=URL.createObjectURL(new Blob([json],{type:'application/json'})); var ln=document.createElement('a'); ln.href=url; ln.download='hyrox-backup-'+key(TODAY)+'.json'; document.body.appendChild(ln); ln.click(); ln.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },2000); toast('백업 파일을 저장했어요'); }
      catch(err){ toast('파일을 저장하지 못했어요'); }
    } else {
      try{ navigator.clipboard.writeText(json).then(function(){ toast('백업 내용을 복사했어요. 메모장에 붙여 .json으로 저장하세요'); },function(){ toast('복사하지 못했어요'); }); }catch(err){ toast('복사하지 못했어요'); }
    }
    return;
  }
  if(a==='restore-ok'){
    var R=ui.restore; ui.restore=null; if(!R) return;
    store.days=R.days; store.tests=R.tests; store.body=R.body; store.wods=R.wods||[]; store.workouts=R.workouts||[]; if(R.goal) store.goal=Object.assign({},GOAL0,R.goal); syncAnaToGoal(); saveLocal();
    if(store.mode==='db'){ Object.keys(store.days).forEach(saveDay); saveTests(); saveBody(); saveWods(); saveWorkouts(); saveGoal(); }
    toast('백업을 불러왔어요'); render(); return;
  }
  if(a==='restore-no'){ ui.restore=null; render(); return; }
  if(a==='addtest'){
    var kk=document.getElementById('lg-k').value, dv=document.getElementById('lg-d').value, tv=parseT(document.getElementById('lg-t').value), tmeta=testMeta(kk), raw=null;
    if(!tv){ toast('시간을 4:35 또는 1:22:30 형식으로 넣어 주세요'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dv)){ toast('날짜를 골라 주세요'); return; }
    if(ui.lgMode==='amt' && tmeta.q){
      var qv=Number(String(document.getElementById('lg-q').value||'').replace(/,/g,''));
      if(!(qv>0)){ toast('해낸 분량을 숫자로 넣어 주세요'); return; }
      raw={mode:'amt',qa:qv,ta:tv}; tv=toStd(tmeta,qv,tv);
    } else if(tmeta.q) raw={mode:'std',qa:tmeta.q,ta:tv};
    var pb=best(kk);
    store.tests=store.tests.concat([{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),k:kk,d:dv,s:tv,raw:raw}]);
    ui.histOpen=kk;
    ui.logKey=kk; saveTests();
    toast(pb&&tv<pb.s?'최고 기록 갱신! '+fmtT(tv):'저장했어요 · '+fmtT(tv));
    render(); return;
  }
  if(a==='addbw'){
    var v=parseFloat(document.getElementById('bw').value);
    if(!(v>30&&v<200)){ toast('체중을 kg으로 넣어 주세요 (예: 78.2)'); return; }
    var td=key(TODAY); store.body=store.body.filter(function(x){ return x.d!==td; }).concat([{d:td,kg:Math.round(v*10)/10}]); saveBody(); toast('체중을 저장했어요'); render(); return;
  }
});
var wodT=null, woT=null;
function setRowField(el){
  var i=Number(el.dataset.ri), f=el.dataset.rf, r=ui.wd&&ui.wd.rows&&ui.wd.rows[i]; if(!r) return;
  var v=el.value;
  if(f==='mv'){ r.mv=v; if(v!=='custom'){ delete r.name; delete r.st; } }
  else if(f==='name'||f==='st') r[f]=v;
  else if(f==='sec'){ var t=parseT(v); if(t) r.sec=t; else delete r.sec; }
  else { var n=Number(v); if(v!==''&&n>=0) r[f]=n; else delete r[f]; }
}
document.addEventListener('input',function(e){
  if(ui.wo && (e.target.dataset&&e.target.dataset.woi!=null || /^wo-/.test(e.target.id))){ readWoForm(); clearTimeout(woT); woT=setTimeout(function(){ var b=document.getElementById("wo-eff"); if(b&&ui.wo) b.innerHTML=woEffHtml(woRec(ui.wo)); },250); return; }
  if(e.target.id==='lg-t'||e.target.id==='lg-q'){ logPreview(); return; }
  if(ui.wd && e.target.dataset && e.target.dataset.rf && e.target.tagName==='INPUT'){ setRowField(e.target); clearTimeout(wodT); wodT=setTimeout(refreshWodPreview,250); return; }
  if(ui.wd && /^w-/.test(e.target.id)){ readWodForm(); clearTimeout(wodT); wodT=setTimeout(refreshWodPreview,e.target.id==='w-text'?500:150); return; }
  if(e.target.id==='in-note'){ clearTimeout(noteT); var v=e.target.value; noteT=setTimeout(function(){ updateDay('note',v.trim()?v:''); },700); }
});
document.addEventListener('change',function(e){
  if(e.target.matches&&e.target.matches('[data-time]')){ var tv0=parseT(e.target.value); if(tv0) e.target.value=fmtT(tv0); }
  var id=e.target.id;
  if(id==='in-km'){ var v=parseFloat(e.target.value); updateDay('km',isFinite(v)&&v>=0?Math.round(v*10)/10:''); }
  if(id==='in-rpe'){ var r=parseInt(e.target.value,10); updateDay('rpe',r>=1&&r<=10?r:''); }
  if(id==='in-note'){ clearTimeout(noteT); updateDay('note',e.target.value.trim()?e.target.value:''); }
  if(id==='lg-k'){ ui.logKey=e.target.value; render(); }
  if(ui.wd && e.target.dataset && e.target.dataset.rf && e.target.tagName==='SELECT'){ readWodForm(); setRowField(e.target); render(); return; }
  if(id==="phw"){ PHW=Array.prototype.slice.call(e.target.files||[],0,3); ui.phw.msg=PHW.length>0&&e.target.files.length>3?"사진은 3장까지만 읽어요":""; render(); return; }
  if(ui.wo&&e.target.dataset&&e.target.dataset.wof==="n"){ readWoForm(); render(); return; }
  if(id==='ph-wod'||id==='ph-res'){ var pf=e.target.files&&e.target.files[0]; PH[id==='ph-wod'?'wod':'res']=pf||null; ui.ph.msg=''; render(); return; }
  if(id==='w-rounds'){ readWodForm(); refreshWodPreview(); }
  if(id==='w-fmt'){ readWodForm(); render(); }
  if(id==='w-team'){ readWodForm(); refreshWodPreview(); }
  if(e.target.dataset&&e.target.dataset.csg!=null){ simCfg.sel[Number(e.target.dataset.csg)]=e.target.checked; saveSimCfg(); render(); return; }
  if(e.target.dataset&&e.target.dataset.camt!=null){ var ci2=Number(e.target.dataset.camt), av=parseFloat(e.target.value); if(av>0) simCfg.amt[ci2]=av; else delete simCfg.amt[ci2]; saveSimCfg(); render(); return; }
  if(id==='sim-pct'){ var spv=Math.round(Number(e.target.value)); if(spv>=1&&spv<=100){ simCfg.pct=spv; saveSimCfg(); render(); } else toast('1~100 사이 숫자를 넣어 주세요'); return; }
  if(id==='g-ag'){ store.goal.ag=e.target.value; saveGoal(); syncAnaToGoal(); render(); return; }
  if(id==='g-pct'){ var gp=Math.round(Number(e.target.value)); if(gp>=1&&gp<=99){ store.goal.pct=gp; saveGoal(); syncAnaToGoal(); render(); } else toast('1~99 사이 숫자를 넣어 주세요'); return; }
  if(id==='a-ag'){ ui.ana.ag=e.target.value; render(); }
  if(id==='a-tpct'){ var tv2=Math.round(Number(e.target.value)); if(tv2>=1&&tv2<=99){ ui.ana.pct=tv2; render(); } else toast('1~99 사이 숫자를 넣어 주세요'); }
  if(id==='restore-file'){
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result);
        if(!o||typeof o.days!=='object'||!Array.isArray(o.tests)||!Array.isArray(o.body)) throw 0;
        ui.restore={days:o.days,tests:o.tests.filter(function(x){ return x&&x.k&&x.d&&x.s; }),body:o.body.filter(function(x){ return x&&x.d&&(x.kg||x.am||x.pm); }),wods:Array.isArray(o.wods)?o.wods.filter(function(x){ return x&&x.id&&x.d; }):[],goal:o.goal&&typeof o.goal==='object'?o.goal:null,workouts:Array.isArray(o.workouts)?o.workouts.filter(function(x){ return x&&x.id&&x.d; }):[]};
        render();
      }catch(err){ toast('이 앱의 백업 파일이 아니에요'); }
    };
    rd.readAsText(f);
  }
});

window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; if(ui.tab==='guide') render(); });
window.addEventListener('appinstalled',function(){ installEvt=null; toast('앱을 설치했어요'); });
if(IS_PWA){
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
}
loadLocal();
syncAnaToGoal();
loadTimer();
render();
initDb();
setInterval(function(){ var t=todayDn(); if(t!==TODAY){ TODAY=t; if(!editing()) render(); } },60000);
})();
</script>
